<!-- SU.html - الإصدار النهائي لحذف زر الإحصائيات -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تحديث - حذف زر الإحصائيات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 20%, #0a0f2a, #020617);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(12,20,35,0.95);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h2 { color: white; margin-bottom: 16px; }
        .status { color: #a5f3fc; margin: 16px 0; font-size: 14px; }
        .log {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 12px;
            margin: 20px 0;
            font-size: 11px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            color: #94a3b8;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
        button {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 60px;
            padding: 12px 28px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
        .progress {
            background: rgba(255,255,255,0.1);
            border-radius: 60px;
            height: 6px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">🔧</div>
    <h2>تحديث التطبيق</h2>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="status">جاري التجهيز...</div>
    <div class="log" id="log"></div>
    <button id="restartBtn">🔄 إعادة التشغيل</button>
</div>

<script>
    (function() {
        const progressFill = document.getElementById('progressFill');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const restartBtn = document.getElementById('restartBtn');
        
        const GITHUB_TOKEN = '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';
        const REPO_OWNER = 'PTslman';
        const REPO_NAME = 'PT.semo';
        const FILE_PATH = 'index.html';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        
        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.className = type;
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            statusDiv.innerHTML = text;
        }
        
        // دالة قوية لحذف زر الإحصائيات من المحتوى
        function removeStatsButton(content) {
            let modified = content;
            
            // 1. حذف زر viewStatsBtn من HTML (أي سطر يحتوي عليه)
            const lines = modified.split('\n');
            const newLines = [];
            let removedCount = 0;
            
            for (const line of lines) {
                // إذا كان السطر يحتوي على viewStatsBtn تخطيه
                if (line.includes('viewStatsBtn') || 
                    (line.includes('إحصائيات') && line.includes('button')) ||
                    (line.includes('stats') && line.includes('btn'))) {
                    removedCount++;
                    continue;
                }
                newLines.push(line);
            }
            
            modified = newLines.join('\n');
            addLog(`✅ تم حذف ${removedCount} سطر متعلق بزر الإحصائيات`, 'success');
            
            // 2. حذف أي كود JavaScript يتعلق بـ viewStatsBtn
            const jsPatterns = [
                /document\.getElementById\(['"]viewStatsBtn['"]\)[^;]*;?\n?/gi,
                /getElementById\(['"]viewStatsBtn['"]\)/gi,
                /viewStatsBtn\.onclick\s*=\s*function[^{]*\{[^}]*\}/gi,
                /\.onclick\s*=\s*async\s*\(\)\s*=>\s*\{[^}]*\}/gi
            ];
            
            for (const pattern of jsPatterns) {
                modified = modified.replace(pattern, '');
            }
            
            // 3. حذف أي mention لـ viewStatsBtn نهائياً
            modified = modified.replace(/viewStatsBtn/g, '');
            
            return modified;
        }
        
        async function startUpdate() {
            updateProgress(10, 'جاري الاتصال بـ GitHub...');
            addLog('🚀 بدء عملية التحديث', 'info');
            
            try {
                // ===== الخطوة 1: جلب الملف =====
                updateProgress(20, 'جلب ملف index.html...');
                addLog('📥 جلب الملف من المستودع...', 'info');
                
                const fileRes = await fetch(API_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                
                if (!fileRes.ok) throw new Error(`فشل جلب الملف: ${fileRes.status}`);
                
                const fileData = await fileRes.json();
                const originalContent = decodeURIComponent(escape(atob(fileData.content)));
                addLog('✅ تم جلب الملف بنجاح', 'success');
                
                // ===== الخطوة 2: تعديل المحتوى =====
                updateProgress(50, 'تعديل الملف...');
                addLog('✏️ جاري حذف زر الإحصائيات...', 'info');
                
                const modifiedContent = removeStatsButton(originalContent);
                
                if (originalContent === modifiedContent) {
                    addLog('⚠️ لم يتم العثور على زر الإحصائيات (ربما محذوف مسبقاً)', 'info');
                } else {
                    addLog('✅ تم حذف زر الإحصائيات بنجاح', 'success');
                }
                
                // ===== الخطوة 3: حفظ الملف =====
                updateProgress(70, 'حفظ التغييرات...');
                addLog('💾 جاري حفظ الملف المعدل...', 'info');
                
                const putRes = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'حذف زر الإحصائيات نهائياً',
                        content: btoa(unescape(encodeURIComponent(modifiedContent))),
                        sha: fileData.sha,
                        branch: 'main'
                    })
                });
                
                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || 'فشل الحفظ');
                }
                
                addLog('✅ تم حفظ الملف في المستودع', 'success');
                
                // ===== الخطوة 4: مسح الكاش =====
                updateProgress(85, 'مسح ذاكرة التخزين...');
                addLog('🧹 جاري مسح الكاش...', 'info');
                
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (const key of keys) {
                        await caches.delete(key);
                        addLog(`✅ حذف الكاش: ${key}`, 'success');
                    }
                }
                
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const reg of registrations) {
                        await reg.unregister();
                        addLog('✅ إلغاء تسجيل Service Worker', 'success');
                    }
                }
                
                // مسح localStorage للإحصائيات
                localStorage.removeItem('spStudio_analytics');
                localStorage.removeItem('spStudio_stats');
                localStorage.removeItem('spStudio_session');
                addLog('✅ تنظيف localStorage', 'success');
                
                // ===== الانتهاء =====
                updateProgress(100, '✅ اكتمل التحديث!');
                addLog('✨ تم حذف زر الإحصائيات نهائياً', 'success');
                
                // إظهار زر إعادة التشغيل
                restartBtn.style.display = 'block';
                
                let countdown = 3;
                restartBtn.textContent = `🔄 إعادة التشغيل (${countdown})`;
                const timer = setInterval(() => {
                    countdown--;
                    restartBtn.textContent = `🔄 إعادة التشغيل (${countdown})`;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        window.location.href = '/PT.semo/?force=' + Date.now();
                    }
                }, 1000);
                
                restartBtn.onclick = () => {
                    clearInterval(timer);
                    window.location.href = '/PT.semo/?force=' + Date.now();
                };
                
            } catch (error) {
                console.error(error);
                updateProgress(0, '❌ فشل التحديث');
                addLog(`❌ خطأ: ${error.message}`, 'error');
                addLog('⚠️ تأكد من أن التوكن صحيح ولديه صلاحيات repo', 'error');
            }
        }
        
        // بدء التحديث فوراً
        startUpdate();
    })();
</script>
</body>
</html>
