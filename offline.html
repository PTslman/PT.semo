<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل | SP Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0b1120, #020617);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .offline-container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 60px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            margin: 20px;
        }
        .offline-icon { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 28px; margin-bottom: 15px; }
        p { color: #a5f3fc; margin-bottom: 30px; line-height: 1.6; }
        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .retry-btn { margin-left: 10px; background: #10b981; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>يرجى التحقق من اتصالك بالشبكة<br>والمحاولة مرة أخرى.</p>
        <div>
            <button onclick="location.reload()">🔄 إعادة المحاولة</button>
            <button class="retry-btn" onclick="location.href='/PT.semo/'">🏠 العودة للرئيسية</button>
        </div>
    </div>
</body>
</html>
