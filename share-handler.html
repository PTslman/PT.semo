<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة | SP Studio</title>
    <style>
        body {
            background: linear-gradient(135deg, #0b1120, #020617);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .container { padding: 40px; background: rgba(255,255,255,0.05); border-radius: 48px; max-width: 500px; }
        .icon { font-size: 60px; margin-bottom: 20px; }
        .received-data { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px; margin: 20px 0; text-align: right; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📨</div>
        <h2>تم استلام المشاركة</h2>
        <div id="content" class="received-data">جاري المعالجة...</div>
        <button onclick="location.href='/PT.semo/'">🏠 العودة إلى التطبيق</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || '';
        const text = params.get('text') || '';
        const url = params.get('url') || '';
        
        let content = '';
        if (title) content += `<strong>العنوان:</strong> ${title}<br>`;
        if (text) content += `<strong>النص:</strong> ${text}<br>`;
        if (url) content += `<strong>الرابط:</strong> ${url}<br>`;
        
        document.getElementById('content').innerHTML = content || 'لا توجد بيانات مشاركة';
        
        // حفظ المشاركة في localStorage
        if (text || title || url) {
            const shared = { title, text, url, time: new Date().toISOString() };
            const history = JSON.parse(localStorage.getItem('sharedHistory') || '[]');
            history.unshift(shared);
            localStorage.setItem('sharedHistory', JSON.stringify(history.slice(0, 20)));
        }
    </script>
</body>
</html>
