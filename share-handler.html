<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاركة | SP Studio</title>
    <style>
        body { background: linear-gradient(135deg, #0b1120, #020617); color: white; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: rgba(255,255,255,0.05); border-radius: 32px; padding: 30px; text-align: center; }
        button { background: #3b82f6; border: none; padding: 10px 24px; border-radius: 60px; cursor: pointer; color: white; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📨 تم استلام المشاركة</h2>
        <div id="content"></div>
        <button onclick="location.href='/'">🏠 العودة للتطبيق</button>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || '';
        const text = params.get('text') || '';
        const url = params.get('url') || '';
        let html = '';
        if (title) html += `<p><strong>العنوان:</strong> ${title}</p>`;
        if (text) html += `<p><strong>النص:</strong> ${text}</p>`;
        if (url) html += `<p><strong>الرابط:</strong> <a href="${url}" target="_blank">${url}</a></p>`;
        document.getElementById('content').innerHTML = html || '<p>لا توجد بيانات مشاركة</p>';
    </script>
</body>
</html>
